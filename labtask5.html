<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Analysis Tool</title>
    <link rel="stylesheet" href="labtask5.css">
</head>
<body>

    <div class="container">
        <h1>Text Analysis Tool</h1>

        <p class="bio">
            Hello! My name is Aninda Chandra Sikder. Welcome to my text analysis tool.
        </p>

        <textarea id="inputText" placeholder="Paste your text here..."></textarea>

        <button onclick="analyzeText()">Analyze Text</button>

        <div id="resultBox">
            <p><strong>Characters:</strong> <span id="charCount">0</span></p>
            <p><strong>Words:</strong> <span id="wordCount">0</span></p>
            <p><strong>Reversed Text:</strong></p>
            <p id="reversedText"></p>
        </div>
    </div>

    <script src="labtask5.js"></script>

</body>
